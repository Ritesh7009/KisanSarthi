version: '3.8'

services:
  # 1. Primary PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: kisansarthi-postgres
    restart: always
    environment:
      POSTGRES_DB: kisansarthi_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kisansarthi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Cache & Real-Time Lock Coordinator
  redis:
    image: redis:7-alpine
    container_name: kisansarthi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Spring Boot 3 + Java 21 High-Throughput Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisansarthi-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kisansarthi_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Vite / React Progressive Web Application Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kisansarthi-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
