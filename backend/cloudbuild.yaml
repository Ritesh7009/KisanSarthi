steps:
  # 1. Build container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/kisansarthi-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/kisansarthi-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Push container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/kisansarthi-backend:$COMMIT_SHA'

  # 3. Deploy container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'kisansarthi-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/kisansarthi-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1024Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'SPRING_PROFILES_ACTIVE=prod'

images:
  - 'gcr.io/$PROJECT_ID/kisansarthi-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/kisansarthi-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
